<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Waste Classifier</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    background: #f2f7f2;
    padding: 20px;
}

h1 {
    font-size: 26px;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 10px;
}

#camera {
    margin: auto;
}

#result {
    font-size: 28px;
    font-weight: bold;
    margin-top: 20px;
}

#confidence {
    font-size: 20px;
}

#bin {
    font-size: 22px;
    margin-top: 15px;
}

</style>

</head>


<body>

<h1>♻️ AI WASTE CLASSIFIER</h1>

<p>Show the waste item to the camera</p>

<video id="video"
       width="300"
       height="300"
       autoplay
       playsinline>
</video>

<button onclick="startCamera()">
📷 START CAMERA
</button>

<div id="result">
Waiting...
</div>

<div id="confidence">
Confidence: --
</div>

<div id="bin">
</div>


<script>

const MODEL_URL ="https://teachablemachine.withgoogle.com/models/BgKuujsPz/";


let model = null;
let video = null;
let canvas = null;
let ctx = null;
let running = false;


async function startCamera() {

    try {

        document.getElementById("result").innerHTML =
            "Starting camera...";

        /*
         * IMPORTANT:
         * Camera is requested immediately
         * after the button is pressed.
         */

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                },
                audio: false
            });


        /*
         * Connect camera to video
         */

        video =
            document.getElementById("video");

        video.srcObject = stream;

        await video.play();


        /*
         * Create canvas for Teachable Machine
         */

        canvas =
            document.createElement("canvas");

        canvas.width = 300;
        canvas.height = 300;

        ctx =
            canvas.getContext("2d");


        running = true;


        document.getElementById("result").innerHTML =
            "Camera Connected";

        document.getElementById("confidence").innerHTML =
            "Loading AI...";


        /*
         * NOW load Teachable Machine
         */

        model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json"
        );


        document.getElementById("confidence").innerHTML =
            "AI Ready";


        /*
         * Start prediction
         */

        predict();


    } catch (error) {

        console.log(error);

        document.getElementById("result").innerHTML =
            "Camera Error";

        document.getElementById("confidence").innerHTML =
            error.name || "Camera permission error";

    }

}

async function predict() {

    if (!running) {
        return;
    }


    /*
     * Copy camera frame to canvas
     */

    ctx.drawImage(
        video,
        0,
        0,
        300,
        300
    );


    /*
     * Ask Teachable Machine to classify it
     */

    const predictions =
        await model.predict(canvas);


    /*
     * Find highest prediction
     */

    let bestPrediction =
        predictions[0];


    for (
        let i = 1;
        i < predictions.length;
        i++
    ) {

        if (
            predictions[i].probability >
            bestPrediction.probability
        ) {

            bestPrediction =
                predictions[i];

        }

    }


    /*
     * Waste name
     */

    const waste =
        bestPrediction.className;


    /*
     * Confidence

     */

    const confidence =
        (
            bestPrediction.probability * 100
        ).toFixed(1);


    /*
     * Display result
     */

    document.getElementById("result")
        .innerHTML =
        waste;


    document.getElementById("confidence")
        .innerHTML =
        "Confidence: " +
        confidence +
        "%";


    /*
     * Bin recommendation
     */

    let binMessage = "";

    const wasteLower =
        waste.toLowerCase();


    if (wasteLower.includes("plastic")) {

        binMessage =
            "🟦 USE PLASTIC BIN";

    }

    else if (wasteLower.includes("paper")) {

        binMessage =
            "📄 USE PAPER BIN";

    }

    else if (wasteLower.includes("metal")) {

        binMessage =
            "🥫 USE METAL BIN";

    }

    else if (wasteLower.includes("organic")) {

        binMessage =
            "🍌 USE ORGANIC BIN";

    }

    else if (wasteLower.includes("glass")) {

        binMessage =
            "🍾 USE GLASS BIN";

    }

    else {

        binMessage =
            "♻️ CHECK APPROPRIATE BIN";

    }


    document.getElementById("bin")
        .innerHTML =
        binMessage;


    /*
     * SEND RESULT TO MIT APP INVENTOR
     */

    if (
        window.AppInventor &&
        typeof window.AppInventor
            .setWebViewString === "function"
    ) {

        window.AppInventor
            .setWebViewString(
                waste +
                "|" +
                confidence
            );

    }


    /*
     * Continue prediction
     */

    if (running) {

        requestAnimationFrame(
            predict
        );

    }

}

</script>

</body>

</html>
