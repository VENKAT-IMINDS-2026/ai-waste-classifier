<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Waste Classifier</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    background: #f2f7f2;
    padding: 20px;
}

h1 {
    font-size: 26px;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 10px;
}

#camera {
    margin: auto;
}

#result {
    font-size: 28px;
    font-weight: bold;
    margin-top: 20px;
}

#confidence {
    font-size: 20px;
}

#bin {
    font-size: 22px;
    margin-top: 15px;
}

</style>

</head>


<body>

<h1>♻️ AI WASTE CLASSIFIER</h1>

<p>Show the waste item to the camera</p>

<div id="camera"></div>

<button onclick="startCamera()">
📷 START CAMERA
</button>

<div id="result">
Waiting...
</div>

<div id="confidence">
Confidence: --
</div>

<div id="bin">
</div>


<script>

const MODEL_URL ="https://teachablemachine.withgoogle.com/models/BgKuujsPz/";


let model;
let webcam;
let running = false;


async function startCamera() {

    try {

        // Load AI model
        model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json"
        );
 const stream =
        await navigator.mediaDevices.getUserMedia({
            video: true
        });

    document.getElementById("video").srcObject =
        stream;
       
        );


        await webcam.setup();

        await webcam.play();


        document
            .getElementById("camera")
            .appendChild(webcam.canvas);


        running = true;

        predict();

    }

    catch(error) {

        document.getElementById("result").innerHTML =
            "Camera Error: " + error.message;

        console.log(error);

    }

}


async function predict() {

    if (!running) {
        return;
    }


    webcam.update();


    const predictions =
        await model.predict(webcam.canvas);


    let bestPrediction =
        predictions[0];


    for (
        let i = 1;
        i < predictions.length;
        i++
    ) {

        if (
            predictions[i].probability >
            bestPrediction.probability
        ) {

            bestPrediction =
                predictions[i];

        }

    }


    const waste =
        bestPrediction.className;


    const confidence =
        (
            bestPrediction.probability * 100
        ).toFixed(1);


    // Display result

    document.getElementById("result")
        .innerHTML =
        waste;


    document.getElementById("confidence")
        .innerHTML =
        "Confidence: " +
        confidence +
        "%";


    // Bin recommendation

    let binMessage = "";


    if (
        waste.toLowerCase() ==
        "plastic"
    ) {

        binMessage =
        "🟦 USE PLASTIC BIN";

    }

    else if (
        waste.toLowerCase() ==
        "paper"
    ) {

        binMessage =
        "📄 USE PAPER BIN";

    }

    else if (
        waste.toLowerCase() ==
        "metal"
    ) {

        binMessage =
        "🥫 USE METAL BIN";

    }

    else if (
        waste.toLowerCase() ==
        "organic"
    ) {

        binMessage =
        "🍌 USE ORGANIC BIN";

    }

    else if (
        waste.toLowerCase() ==
        "glass"
    ) {

        binMessage =
        "🍾 USE GLASS BIN";

    }


    document.getElementById("bin")
        .innerHTML =
        binMessage;


    // Send result to MIT App Inventor

    if (window.AppInventor) {

        window.AppInventor
            .setWebViewString(
                waste +
                "|" +
                confidence
            );

    }


    // Continue prediction

    window.requestAnimationFrame(
        predict
    );

}

</script>

</body>

</html>
